name: Financial application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asufc_test
          POSTGRES_USER: asufc
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asufc -d asufc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGDATABASE: asufc_test
      PGUSER: asufc
      PGPASSWORD: ci-disposable-password
      SESSION_SECURE: '0'
      STAFF_USER: teststaff
      STAFF_PASSWORD: ci-test-only-password
      ASUFC_TEST_DATABASE: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx
      - run: python -m pytest -v
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asufc_test
          POSTGRES_USER: asufc
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asufc -d asufc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGDATABASE: asufc_test
      PGUSER: asufc
      PGPASSWORD: ci-disposable-password
      SESSION_SECURE: '0'
      STAFF_USER: teststaff
      STAFF_PASSWORD: ci-test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/asufc-api.log 2>&1 &
      - run: |
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/funding)" = 401 ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/asufc-api.log
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --only-shell chromium
        working-directory: frontend
        timeout-minutes: 4
      - run: npm run test:e2e
        working-directory: frontend
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asufc_test
          POSTGRES_USER: asufc
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asufc -d asufc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup and restore on disposable PostgreSQL
        env:
          PGPASSWORD: ci-disposable-password
        run: |
          set -euo pipefail
          bash -n scripts/backup.sh scripts/restore-check.sh
          cid=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n1)
          test -n "$cid"
          docker exec -i "$cid" psql -U asufc -d asufc_test -v ON_ERROR_STOP=1 < backend/app/schema.sql
          docker exec "$cid" psql -U asufc -d asufc_test -v ON_ERROR_STOP=1 -c "INSERT INTO funding(name,academic_year,kind,expected_cents,received_cents) VALUES ('Fictional restore test','2026-2027','cash',10000,10000); INSERT INTO funding_receipt(funding_id,cents,actor) VALUES (1,10000,'test'); INSERT INTO funding_eligibility VALUES (1,ARRAY['ASUFCGR','ASUFCFSBP'],ARRAY['Test','Fictional Market'],ARRAY['Groceries']); INSERT INTO budget(funding_id,program_code,cents) VALUES (1,'ASUFCGR',8000); INSERT INTO purchase(purchase_date,supplier,purchase_type,description,cents) VALUES ('2026-11-01','Test','Groceries','',2500); INSERT INTO allocation VALUES (1,1,2500); INSERT INTO staff_session VALUES ('test-hash','teststaff',now()+interval '1 hour');"
          docker exec "$cid" pg_dump -U asufc -d asufc_test -Fc --no-owner --no-acl --exclude-table-data=public.staff_session --exclude-table-data=public.staff_login_attempt > /tmp/test.dump
          docker exec "$cid" createdb -U asufc asufc_restore_test
          docker exec -i "$cid" pg_restore -U asufc -d asufc_restore_test --no-owner --no-acl --exit-on-error < /tmp/test.dump
          test "$(docker exec "$cid" psql -U asufc -d asufc_restore_test -Atc 'SELECT capacity_cents FROM funding_capacity WHERE id=1')" = 10000
          test "$(docker exec "$cid" psql -U asufc -d asufc_restore_test -Atc 'SELECT sum(cents) FROM active_allocation')" = 2500
          test "$(docker exec "$cid" psql -U asufc -d asufc_restore_test -Atc 'SELECT count(*) FROM staff_session')" = 0
          test "$(docker exec "$cid" psql -U asufc -d asufc_restore_test -Atc 'SELECT cardinality(eligible_suppliers) FROM effective_funding_eligibility WHERE funding_id=1')" = 2
          sudo apt-get update -qq
          sudo apt-get install -y age
          umask 077
          age-keygen -o /tmp/asufc-ci.agekey
          recipient=$(age-keygen -y /tmp/asufc-ci.agekey)
          age -r "$recipient" -o /tmp/test.dump.age /tmp/test.dump
          age -d -i /tmp/asufc-ci.agekey /tmp/test.dump.age | cmp - /tmp/test.dump
          docker exec "$cid" createdb -U asufc asufc_encrypted_restore_test
          age -d -i /tmp/asufc-ci.agekey /tmp/test.dump.age | docker exec -i "$cid" pg_restore -U asufc -d asufc_encrypted_restore_test --no-owner --no-acl --exit-on-error
          test "$(docker exec "$cid" psql -U asufc -d asufc_encrypted_restore_test -Atc 'SELECT sum(cents) FROM active_allocation')" = 2500
          test "$(docker exec "$cid" psql -U asufc -d asufc_encrypted_restore_test -Atc 'SELECT count(*) FROM staff_session')" = 0
          test "$(docker exec "$cid" psql -U asufc -d asufc_encrypted_restore_test -Atc 'SELECT cardinality(eligible_suppliers) FROM effective_funding_eligibility WHERE funding_id=1')" = 2
          bash -n scripts/backup-encrypted.sh scripts/restore-encrypted-check.sh
          rm -f /tmp/test.dump /tmp/test.dump.age /tmp/asufc-ci.agekey
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: python -m pip install -r backend/requirements.txt pip-audit
      - run: pip-audit
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  backup-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          if bash scripts/check-backup.sh "$dir"; then exit 1; fi
          printf 'fictional encrypted archive' > "$dir/test.dump.age"
          sha256sum "$dir/test.dump.age" > "$dir/test.dump.age.sha256"
          bash scripts/check-backup.sh "$dir"
          touch -d '40 hours ago' "$dir/test.dump.age"
          if bash scripts/check-backup.sh "$dir"; then exit 1; fi
          touch "$dir/test.dump.age"
          printf 'corruption' >> "$dir/test.dump.age"
          if bash scripts/check-backup.sh "$dir"; then exit 1; fi
  gateway:
    runs-on: ubuntu-latest
    env:
      ASUFC_DOMAIN: localhost
      POSTGRES_PASSWORD: fictional-ci-db-password
      STAFF_USER: teststaff
      STAFF_PASSWORD: fictional-ci-staff-password
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated HTTPS stack
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml up --build -d
      - name: Verify gateway headers, redirect and secure session
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if [ "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/api/funding)" = 401 ]; then break; fi
            sleep 2
          done
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/api/funding)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
          curl -ksD /tmp/asufc-headers -o /dev/null https://localhost/
          grep -qi '^strict-transport-security:' /tmp/asufc-headers
          grep -qi '^content-security-policy:' /tmp/asufc-headers
          grep -qi '^x-frame-options: DENY' /tmp/asufc-headers
          curl -ksSf -c /tmp/asufc-cookie -D /tmp/asufc-login -H 'X-ASUFC-Request: 1' -H 'Content-Type: application/json' -d '{"username":"teststaff","password":"fictional-ci-staff-password"}' https://localhost/api/auth/login
          grep -qi '^set-cookie:.*secure' /tmp/asufc-login
          grep -qi '^set-cookie:.*httponly' /tmp/asufc-login
          curl -ksSf -b /tmp/asufc-cookie https://localhost/api/funding
          test "$(curl -ks -b /tmp/asufc-cookie -X POST -o /dev/null -w '%{http_code}' https://localhost/api/auth/logout)" = 403
          curl -ksSf -b /tmp/asufc-cookie -H 'X-ASUFC-Request: 1' -X POST https://localhost/api/auth/logout
          test "$(curl -ks -b /tmp/asufc-cookie -o /dev/null -w '%{http_code}' https://localhost/api/funding)" = 401
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml down -v
