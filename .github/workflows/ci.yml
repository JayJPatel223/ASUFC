name: Financial application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asufc_test
          POSTGRES_USER: asufc
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asufc -d asufc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGDATABASE: asufc_test
      PGUSER: asufc
      PGPASSWORD: ci-disposable-password
      SESSION_SECURE: '0'
      STAFF_USER: teststaff
      STAFF_PASSWORD: ci-test-only-password
      ASUFC_TEST_DATABASE: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx
      - run: python -m pytest -v
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asufc_test
          POSTGRES_USER: asufc
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asufc -d asufc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGDATABASE: asufc_test
      PGUSER: asufc
      PGPASSWORD: ci-disposable-password
      SESSION_SECURE: '0'
      STAFF_USER: teststaff
      STAFF_PASSWORD: ci-test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/asufc-api.log 2>&1 &
      - run: |
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/funding)" = 401 ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/asufc-api.log
          exit 1
      - run: npm install
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asufc_test
          POSTGRES_USER: asufc
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asufc -d asufc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup and restore on disposable PostgreSQL
        env:
          PGPASSWORD: ci-disposable-password
        run: |
          set -euo pipefail
          bash -n scripts/backup.sh scripts/restore-check.sh
          cid=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n1)
          test -n "$cid"
          docker exec -i "$cid" psql -U asufc -d asufc_test -v ON_ERROR_STOP=1 < backend/app/schema.sql
          docker exec "$cid" psql -U asufc -d asufc_test -v ON_ERROR_STOP=1 -c "INSERT INTO funding(name,academic_year,kind,expected_cents,received_cents) VALUES ('Fictional restore test','2026-2027','cash',10000,10000); INSERT INTO funding_receipt(funding_id,cents,actor) VALUES (1,10000,'test'); INSERT INTO budget(funding_id,program_code,cents) VALUES (1,'ASUFCGR',8000); INSERT INTO purchase(purchase_date,supplier,purchase_type,description,cents) VALUES ('2026-11-01','Test','Groceries','',2500); INSERT INTO allocation VALUES (1,1,2500); INSERT INTO staff_session VALUES ('test-hash','teststaff',now()+interval '1 hour');"
          docker exec "$cid" pg_dump -U asufc -d asufc_test -Fc --no-owner --no-acl --exclude-table-data=public.staff_session --exclude-table-data=public.staff_login_attempt > /tmp/test.dump
          docker exec "$cid" createdb -U asufc asufc_restore_test
          docker exec -i "$cid" pg_restore -U asufc -d asufc_restore_test --no-owner --no-acl --exit-on-error < /tmp/test.dump
          test "$(docker exec "$cid" psql -U asufc -d asufc_restore_test -Atc 'SELECT capacity_cents FROM funding_capacity WHERE id=1')" = 10000
          test "$(docker exec "$cid" psql -U asufc -d asufc_restore_test -Atc 'SELECT sum(cents) FROM active_allocation')" = 2500
          test "$(docker exec "$cid" psql -U asufc -d asufc_restore_test -Atc 'SELECT count(*) FROM staff_session')" = 0
          rm -f /tmp/test.dump
