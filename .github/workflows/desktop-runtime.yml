name: Offline staff runtime

on:
  push:
    paths:
      - '.github/workflows/desktop-runtime.yml'
      - 'backend/**'
      - 'desktop/**'
      - 'frontend/**'
      - 'scripts/desktop_backend.py'
      - 'scripts/stage_desktop_runtime.py'
      - 'scripts/verify_desktop_install.py'
      - 'scripts/verify_desktop_runtime.py'
  workflow_dispatch:
    inputs:
      sign:
        description: Sign Windows and macOS packages with institutional credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offline-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-runtime:
    if: ${{ !inputs.sign || github.ref == 'refs/heads/main' }}
    name: Runtime on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
          - name: Windows x64
            os: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: python -m pip install -r backend/requirements.txt pyinstaller==6.22.3
      - run: python scripts/stage_desktop_runtime.py --output desktop/runtime
      - name: Verify persisted ledger and local reports
        shell: bash
        run: |
          set -euo pipefail
          executable=desktop/runtime/asufc-backend/asufc-backend
          if [ "${RUNNER_OS}" = Windows ]; then executable+=.exe; fi
          python scripts/verify_desktop_runtime.py -- "$executable" --frontend desktop/runtime/frontend --postgres-bin desktop/runtime/postgres/bin
      - run: npm ci
        working-directory: desktop
      - run: npm audit
        working-directory: desktop
      - name: Verify direct launch and reopening the desktop window
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = Linux ]; then
            xvfb-run -a node frontend/e2e-desktop/verify.mjs
          else
            node frontend/e2e-desktop/verify.mjs
          fi
      - name: Prepare macOS notarization key
        if: ${{ inputs.sign && runner.os == 'macOS' }}
        shell: bash
        env:
          NOTARIZATION_KEY_BASE64: ${{ secrets.DESKTOP_APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NOTARIZATION_KEY_BASE64"
          umask 077
          key="$RUNNER_TEMP/asufc-notarization.p8"
          printf '%s' "$NOTARIZATION_KEY_BASE64" | base64 -D > "$key"
          printf 'APPLE_API_KEY=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Package desktop app
        working-directory: desktop
        shell: bash
        env:
          SIGN_DESKTOP: ${{ inputs.sign && runner.os != 'Linux' && 'true' || 'false' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.sign && runner.os != 'Linux' && 'true' || 'false' }}
          CSC_LINK: ${{ inputs.sign && runner.os == 'macOS' && secrets.DESKTOP_MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.sign && runner.os == 'macOS' && secrets.DESKTOP_MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ inputs.sign && runner.os == 'macOS' && secrets.DESKTOP_APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.sign && runner.os == 'macOS' && secrets.DESKTOP_APPLE_API_ISSUER || '' }}
          WIN_CSC_LINK: ${{ inputs.sign && runner.os == 'Windows' && secrets.DESKTOP_WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ inputs.sign && runner.os == 'Windows' && secrets.DESKTOP_WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$SIGN_DESKTOP" = true ]; then
            if [ "$RUNNER_OS" = macOS ]; then
              if [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
                echo "Configure the institutional macOS signing and notarization credentials." >&2
                exit 1
              fi
            else
              test -n "$WIN_CSC_LINK"
            fi
            npm run package -- --config.forceCodeSigning=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            npm run package
          fi
      - name: Verify the runtime from the installed or extracted package
        shell: bash
        env:
          VERIFY_DESKTOP_SIGNATURE: ${{ inputs.sign && runner.os != 'Linux' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo unshare --net bash -eu -c 'ip link set lo up; exec runuser -u "$1" -- "$2" scripts/verify_desktop_install.py' _ "$USER" "$(command -v python)"
          else
            python scripts/verify_desktop_install.py
          fi
      - name: Remove temporary notarization key
        if: ${{ always() && inputs.sign && runner.os == 'macOS' }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/asufc-notarization.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.sign && runner.os != 'Linux' && 'signed' || 'candidate' }}-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/SHA256SUMS.txt
