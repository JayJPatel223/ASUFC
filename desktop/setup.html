<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'">
  <title>Set up ASUFC Finance</title>
  <link rel="stylesheet" href="./setup.css">
  <script src="./setup.js" defer></script>
</head>
<body>
<main>
  <h1>Set up ASUFC Finance</h1>
  <p>Choose a password for the staff login on this computer. The username is <strong>staff</strong>.</p>
  <form id="new-ledger">
    <label>New password
      <input name="password" type="password" required minlength="16" maxlength="1024" autocomplete="new-password">
    </label>
    <label>Confirm password
      <input name="confirmation" type="password" required minlength="16" maxlength="1024" autocomplete="new-password">
    </label>
    <p class="hint">Use at least 16 characters.</p>
    <button type="submit">Create staff login</button>
  </form>
  <details>
    <summary>Restore an encrypted backup</summary>
    <form id="restore-ledger">
      <p>Use the backup passphrase. After restoring, sign in with the staff password from the backup.</p>
      <button id="choose-backup" type="button">Choose backup file</button>
      <p id="selected-backup" aria-live="polite">No backup selected</p>
      <label>Backup passphrase
        <input name="passphrase" type="password" required minlength="16" maxlength="1024" autocomplete="off">
      </label>
      <button id="restore-backup" type="submit" disabled>Restore backup</button>
    </form>
  </details>
  <p id="error" role="alert"></p>
</main>
</body>
</html>
