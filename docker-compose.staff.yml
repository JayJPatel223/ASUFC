# Loopback workspace for staff development and testing with fictional records.
services:
  api:
    environment:
      SESSION_SECURE: "0"
    ports: !reset []
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      ASUFC_DOMAIN: http://127.0.0.1:8080
      NO_PROXY: api,localhost,127.0.0.1
      no_proxy: api,localhost,127.0.0.1
    ports:
      - "127.0.0.1:${ASUFC_STAFF_PORT:-8080}:8080"
    depends_on:
      - api
