services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: asufc
      POSTGRES_USER: asufc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asufc"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      PGHOST: db
      PGDATABASE: asufc
      PGUSER: asufc
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SESSION_SECURE: ${SESSION_SECURE:-0}
      STAFF_USER: ${STAFF_USER:-staff}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?set STAFF_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
